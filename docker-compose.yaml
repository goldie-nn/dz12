version: '3.8'

services:
  db:
    image: mysql:5.6
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: database
      MYSQL_USER: userdb
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  web:
    build: .
    container_name: java_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  mysql_data: