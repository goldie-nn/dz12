version: '3.8'

services:
  db:
    image: mysql:5.6
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: database
      MYSQL_USER: userdb
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: java_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    entrypoint: >
      /bin/sh -c "
      mkdir -p /usr/local/tomcat/ROOT &&
      cp /usr/local/tomcat/webapps/ROOT/Config.properties /usr/local/tomcat/ROOT/Config.properties 2>/dev/null || true;
      catalina.sh run
volumes:
  mysql_data: